[project]
name = "petface"
version = "0.1.0"
description = "Pet face verification model"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "timm>=1.0.24",
    "pillow>=12.0.0",
    "numpy>=2.0.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.9.0",
    "tqdm>=4.60.0",
    "easydict>=1.10",
    "tensorboard>=2.18.0",
    "opencv-python-headless>=4.10.0",
    "onnx>=1.20.1",
    "onnxruntime>=1.24.2",
    "onnxscript>=0.6.2",
]

[tool.uv]
find-links = ["https://download.pytorch.org/whl/cu128"]
